name: unit-tests

# Unit tests only (Surefire, `mvn test`) on every push, on free GitHub-hosted runners.
# Integration and example tests run on demand with /testit or /testmerge (build-and-test-warp).

on:
  push:
    branches: [ '**' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx3000m

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Unit tests
        run: mvn --batch-mode --update-snapshots test
