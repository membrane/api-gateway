name: unit-tests

# Unit tests only (Surefire, `mvn test`) on free GitHub-hosted runners: on every pull request
# (the check branch protection sees on the merge commit; also covers forks) and on pushes to the
# long-lived branches. Feature branches are tested through their PR only, so nothing runs twice.
# Integration and example tests run in build-and-test-warp: on every push to master and on
# demand with /testit or /testmerge.

on:
  push:
    branches: [ master, 6.X ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx3000m

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Unit tests
        run: mvn --batch-mode --update-snapshots test
