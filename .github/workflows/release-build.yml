name: Create Release
on:
  pull_request:
    types:
      - closed
    branches:
      - master
      - 7**
      - 6**
      - 5**
      - 4**

permissions:
  contents: write
  pull-requests: write
  # Needed to start the 'Build Docker Image' workflow via workflow_dispatch.
  actions: write

jobs:
  build-release:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'Release ')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Get version
        id: get_version
        run: echo '${{ github.head_ref }}' | sed 's/v/::set-output name=VERSION::/'
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - id: compile-membrane
        name: Compile Membrane
        run: |
          mvn install \
            --no-transfer-progress \
            --batch-mode \
            -DskipTests
      - name: Setup next Snapshot version
        run: |
          cd distribution
          if [ -e src/test/java/com/predic8/membrane/examples/env/ConsistentVersionNumbers.java ] ; then
            CLASS=com.predic8.membrane.examples.env.ConsistentVersionNumbers
          elif [ -e src/test/java/com/predic8/membrane/examples/withoutinternet/env/ConsistentVersionNumbers.java ] ; then
            CLASS=com.predic8.membrane.examples.withoutinternet.env.ConsistentVersionNumbers
          else
            echo "ConsistentVersionNumbers.java not found."
            exit 1
          fi
          mvn test-compile exec:java \
            --no-transfer-progress \
            --batch-mode \
            -DmainClass=$CLASS \
            -Dexec.classpathScope="test" \
            -DmainArgs="-snapshot"
          cd ..
      - name: Create Pull Request for next Snapshot
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Snapshot version"
          title: "Snapshot version"
          author: "github-actions <github-actions@github.com>"
          body: "Update all project `pom.xml` and related files to post-${{ steps.get_version.outputs.VERSION }} snapshot version"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - id: install-secret-key
        name: Install gpg secret key
        run: |
          # Install gpg secret key
          cat <(echo -e "${{ secrets.OSSRH_GPG_SECRET_KEY }}") | gpg --batch --import
          # Verify gpg secret key
          gpg --list-secret-keys --keyid-format LONG
      - id: build-artifact
        name: Build release artefacts
        run: |
          mvn \
            --no-transfer-progress \
            --batch-mode \
            -DskipTests \
            -Pcentral \
            -Dgpg.passphrase=${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }} \
            clean verify
      - name: Ensure release files exist
        run: |
          touch distribution/release-notes/${{ steps.get_version.outputs.VERSION }}.md
          touch distribution/target/membrane-api-gateway-${{ steps.get_version.outputs.VERSION }}.zip.asc
      - name: Create Release v${{ steps.get_version.outputs.VERSION }}
        uses: ncipollo/release-action@v1
        with:
          name: v${{ steps.get_version.outputs.VERSION }}
          tag: ${{ github.head_ref }}
          commit: ${{ github.event.pull_request.merge_commit_sha }}
          prerelease: true
#          makeLatest: true
          bodyFile: "distribution/release-notes/${{ steps.get_version.outputs.VERSION }}.md"
          artifacts: "core/target/classes/com/predic8/membrane/core/config/json/membrane.schema.json,distribution/target/membrane-api-gateway-${{ steps.get_version.outputs.VERSION }}.zip,distribution/target/membrane-api-gateway-${{ steps.get_version.outputs.VERSION }}.zip.asc"
          token: ${{ github.token }}

      # A release created with the default GITHUB_TOKEN does not fire the
      # 'release: published' event: GitHub suppresses workflow triggering for
      # events created by GITHUB_TOKEN, so the Docker build never started.
      # workflow_dispatch is explicitly exempt from that restriction, so the
      # build is kicked off here instead. It is dispatched on the base branch
      # (the tag has no workflow file of its own for older releases) and gets
      # the release tag passed as an input.
      - name: Trigger Docker image build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          RELEASE_TAG: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run docker-publish.yml \
            --repo "$REPO" \
            --ref "$BASE_REF" \
            --field tag="$RELEASE_TAG" \
            --field latest=false

  trigger-website:
    needs: build-release
    uses: ./.github/workflows/trigger-website-pipeline.yml
    with:
      version: ${{ needs.build-release.outputs.version }}
    secrets: inherit

  # A release created with the default GITHUB_TOKEN does not fire the
  # 'release: published' event: GitHub suppresses workflow triggering for
  # events created by GITHUB_TOKEN, so the Docker build never started.
  # workflow_dispatch is explicitly exempt from that restriction, so the build
  # is kicked off here instead.
  #
  # Dispatched on the base branch rather than on the tag, because release-pr.yml
  # creates a branch AND a tag named v<version>, so '--ref v<version>' would be
  # ambiguous; the tag is passed as an input instead.
  #
  # Its own job on purpose: a dispatch that fails -- against a branch whose
  # docker-publish.yml predates the 'tag' input the API rejects it with 422 --
  # must not fail the release itself or block the jobs beside it. It also keeps
  # 'actions: write' off the Maven steps in build-release.
  trigger-docker:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger Docker image build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          RELEASE_TAG: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run docker-publish.yml \
            --repo "$REPO" \
            --ref "$BASE_REF" \
            --field tag="$RELEASE_TAG" \
            --field latest=false
