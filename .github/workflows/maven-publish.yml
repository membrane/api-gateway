name: Publish package to the Maven Central Repository
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v7.4.0. Required unless the workflow is run on the tag itself."
        type: string
        required: false
        default: ''
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Without this the workflow deploys whatever ${{ github.ref }} points at,
      # so dispatching it on a branch deploys that branch's SNAPSHOT to Maven
      # Central instead of the release. Resolving an explicit tag also avoids
      # the ambiguity of release-pr.yml creating a branch AND a tag named
      # v<version>.
      - name: Resolve release tag
        id: release_version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag. Dispatch this workflow on the tag, or pass the 'tag' input (e.g. v7.4.0)."
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $RELEASE_TAG to Maven Central"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release_version.outputs.release_tag }}
          persist-credentials: false
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - id: install-secret-key
        name: Install gpg secret key
        run: |
          cat <(echo -e "${{ secrets.OSSRH_GPG_SECRET_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
      - name: Check GPG key expiry
        run: |
          EXPIRY=$(gpg --list-secret-keys --keyid-format LONG \
            | grep -oP '(?<=expires: )\d{4}-\d{2}-\d{2}' | head -1 || true)
          if [ -z "$EXPIRY" ]; then
            echo "GPG key has no expiry date set."
          else
            EXPIRY_TS=$(date -d "$EXPIRY" +%s)
            NOW_TS=$(date +%s)
            if [ "$EXPIRY_TS" -lt "$NOW_TS" ]; then
              echo "ERROR: GPG key expired on $EXPIRY" >&2
              exit 1
            else
              DAYS=$(( (EXPIRY_TS - NOW_TS) / 86400 ))
              echo "GPG key valid. Expires: $EXPIRY (in $DAYS days)"
            fi
          fi
      - id: publish-to-central
        name: Publish to Central Repository
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          mvn clean && 
          mvn -pl distribution cyclonedx:makeAggregateBom &&
          mvn \
            --no-transfer-progress \
            --batch-mode \
            -Pcentral \
            -DskipTests \
            deploy
