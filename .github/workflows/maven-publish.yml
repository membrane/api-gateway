name: Publish package to the Maven Central Repository
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v7.4.0. Required unless the workflow is run on the tag itself."
        type: string
        required: false
        default: ''
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Without this the workflow deploys whatever ${{ github.ref }} points at,
      # so dispatching it on a branch deploys that branch's SNAPSHOT to Maven
      # Central instead of the release. Resolving an explicit tag also avoids
      # the ambiguity of release-pr.yml creating a branch AND a tag named
      # v<version>.
      - name: Resolve release tag
        id: release_version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag. Dispatch this workflow on the tag, or pass the 'tag' input (e.g. v7.4.0)."
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $RELEASE_TAG to Maven Central"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release_version.outputs.release_tag }}
          persist-credentials: false
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # Maven 3.10 leaves maven-metadata-local.xml in the central-publishing
      # bundle, which Central rejects ("content that does NOT have a .pom file").
      # Installed from Apache with a pinned checksum instead of a third-party
      # action: this mvn runs the deploy with the Central credentials and the
      # GPG key, so it must not come from code we don't control.
      - name: Set up Maven 3.9
        env:
          MAVEN_VERSION: 3.9.16
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          set -euo pipefail
          ARCHIVE="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/$ARCHIVE"
          echo "${MAVEN_SHA512}  $RUNNER_TEMP/$ARCHIVE" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Show Maven version
        run: mvn --version
      - id: install-secret-key
        name: Install gpg secret key
        run: |
          cat <(echo -e "${{ secrets.OSSRH_GPG_SECRET_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
      - name: Check GPG key expiry
        run: |
          EXPIRY=$(gpg --list-secret-keys --keyid-format LONG \
            | grep -oP '(?<=expires: )\d{4}-\d{2}-\d{2}' | head -1 || true)
          if [ -z "$EXPIRY" ]; then
            echo "GPG key has no expiry date set."
          else
            EXPIRY_TS=$(date -d "$EXPIRY" +%s)
            NOW_TS=$(date +%s)
            if [ "$EXPIRY_TS" -lt "$NOW_TS" ]; then
              echo "ERROR: GPG key expired on $EXPIRY" >&2
              exit 1
            else
              DAYS=$(( (EXPIRY_TS - NOW_TS) / 86400 ))
              echo "GPG key valid. Expires: $EXPIRY (in $DAYS days)"
            fi
          fi
      - id: publish-to-central
        name: Publish to Central Repository
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          mvn clean && 
          mvn -pl distribution cyclonedx:makeAggregateBom &&
          mvn \
            --no-transfer-progress \
            --batch-mode \
            -Pcentral \
            -DskipTests \
            deploy
