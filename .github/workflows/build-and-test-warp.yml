name: build-and-test-warp

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the older run; runs on master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Set at job level so it applies on both bash (Linux) and pwsh (Windows).
  MAVEN_OPTS: -Xmx3000m

jobs:
  test-ubuntu:
    runs-on: warp-ubuntu-2404-x64-4x
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Maven Build
        run: mvn --batch-mode --update-snapshots -Pno-internet install

  test-windows:
    runs-on: warp-windows-2025-vs2026-x64-4x
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Maven Build
        run: mvn --batch-mode --update-snapshots -Pno-internet install
