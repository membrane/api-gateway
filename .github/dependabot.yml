version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "master"
    open-pull-requests-limit: 0
    schedule:
      interval: "daily"
  
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "6.X"
    open-pull-requests-limit: 0
    schedule:
      interval: "daily"

  # Third-party actions are pinned to commit SHAs, for which GitHub raises no security alerts. Version updates
  # keep the pins current instead, all actions in one pull request per month.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
