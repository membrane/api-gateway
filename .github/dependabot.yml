version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "master"
    open-pull-requests-limit: 0
    schedule:
      interval: "daily"
  
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "6.X"
    open-pull-requests-limit: 0
    schedule:
      interval: "daily"

  # Security updates for the actions, which are pinned to commit SHAs. Version updates are off, as for Maven.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
