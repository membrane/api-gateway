openapi: '3.0.2'
info:
  # array.yml and boolean.yml have the same id on purpose!
  title: Array API
  version: '1.0'
servers:
  - url: https://api.server.test/
paths:
  /array:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Array"
      responses:
        '200':
          description: OK

components:
  schemas:
    Array:
      type: object
      properties:
        no-type:
          type: array
        only-numbers:
          type: array
          items:
            type: number
        prefixed:
          type: array
        min-max:
          type: array
          minItems: 2
          maxItems: 4
        uniqueItems:
          type: array
          uniqueItems: true
        objects:
          type: array
          items:
            $ref: "#/components/schemas/Complex"
    Complex:
      type: object
      required:
        - a
        - b
      properties:
        a: 
          type: string
        b: 
          type: integer

 
            
