openapi: "3.1.0"
info:
  title: Pattern Properties API
  version: '1.0'
paths:
  /test:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                foo:
                  type: "array"
                  maxItems: 3
                bar:
                  type: "array"
              patternProperties:
                f.o:
                  minItems: 2
              additionalProperties:
                type: "integer"
      responses:
        "200":
          description: "OK"
  /prefix:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              patternProperties:
                "^x-":
                  type: string
              additionalProperties:
                type: integer
      responses:
        "200":
          description: "OK"
  /invalid-regex:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvalidRegex"
          application/xml:
            schema:
              $ref: "#/components/schemas/InvalidRegex"
      responses:
        "200":
          description: "OK"
components:
  schemas:
    InvalidRegex:
      type: object
      properties:
        name:
          type: string
      patternProperties:
        "[":
          type: string
      additionalProperties: false
