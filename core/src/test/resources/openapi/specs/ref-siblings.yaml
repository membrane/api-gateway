openapi: '3.0.3'
info:
  title: Ref Siblings Test API
  version: '1.0'
paths:
  /siblings:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nullableRef:
                  $ref: '#/components/schemas/Address'
                  nullable: true
                readOnlyRef:
                  $ref: '#/components/schemas/Address'
                  readOnly: true
                extraRequiredRef:
                  $ref: '#/components/schemas/Address'
                  required:
                    - zip
                narrowedRef:
                  $ref: '#/components/schemas/AnyValue'
                  type: string
components:
  schemas:
    AnyValue:
      description: no type, so only a keyword next to the $ref constrains the value
    Address:
      type: object
      required:
        - street
        - city
      properties:
        street:
          type: string
        city:
          type: string
