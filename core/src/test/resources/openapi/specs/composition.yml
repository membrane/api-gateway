openapi: '3.0.2'
info:
  title: Composition Test API
  version: '1.0'
servers:
  - url: https://api.server.test/
paths:
  /composition:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  allOf:
                    - type: string
                    - maxLength: 5
                    - minLength: 3
                contact:
                  anyOf:
                    - type: string
                      format: email
                    - type: string
                      pattern: "\\d+"
                multiple:
                  oneOf:
                    - type: number
                      multipleOf: 3
                    - type: number
                      multipleOf: 5
                factored-out:
                  type: number
                  oneOf:
                    - multipleOf: 3
                    - multipleOf: 5
                not-string:
                  not:
                    type: string
                inheritance:
                  allOf:
                    - $ref: "#/components/schemas/Address"
                    - type: object
                      required:
                        - country
                      properties:
                        country:
                          type: string
                          enum:
                            - FR
                            - IN
                            - CN
                            - US

  /composition-ref-allof:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefAllOfType"

  /composition-ref-oneof:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefOneOfType"

  /composition-ref-anyof:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefAnyOfType"

  /composition-ref-not:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefNotType"

  /composition-ref-cycle:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefCycleA"

  /composition-ref-allof-xml:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/RefAllOfXmlType"

  /composition-ref-recursive:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefRecursiveNode"

components:
  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
    RefAllOfType:
      type: object
      allOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - SOME-VALUE
    RefOneOfType:
      oneOf:
        - type: object
          required: [ email ]
          properties:
            email:
              type: string
        - type: object
          required: [ phone ]
          properties:
            phone:
              type: string
    RefAnyOfType:
      anyOf:
        - type: object
          required: [ email ]
          properties:
            email:
              type: string
        - type: object
          required: [ phone ]
          properties:
            phone:
              type: string
    RefNotType:
      not:
        type: object
    RefRecursiveNode:
      type: object
      required: [ id ]
      properties:
        id:
          type: string
        next:
          $ref: "#/components/schemas/RefRecursiveNode"
    RefCycleA:
      type: object
      allOf:
        - $ref: "#/components/schemas/RefCycleB"
    RefCycleB:
      type: object
      allOf:
        - $ref: "#/components/schemas/RefCycleA"
    RefAllOfXmlType:
      type: object
      xml:
        name: order
      allOf:
        - type: object
          properties:
            id:
              type: integer
            customer:
              type: string


