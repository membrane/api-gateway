openapi: "3.1.0"
info:
  title: Unevaluated Properties API
  version: '1.0'
paths:
  /closed:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              patternProperties:
                "^x-.*":
                  type: string
              unevaluatedProperties: false
      responses:
        "200":
          description: "OK"
  /allof:
    post:
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Base'
                - type: object
                  properties:
                    name:
                      type: string
              unevaluatedProperties: false
      responses:
        "200":
          description: "OK"
  /typed:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              unevaluatedProperties:
                type: integer
      responses:
        "200":
          description: "OK"
  /anyof:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
              anyOf:
                - properties:
                    kind:
                      const: cat
                    lives:
                      type: integer
                  required: [kind]
                - properties:
                    kind:
                      const: dog
                    tricks:
                      type: integer
                  required: [kind]
              unevaluatedProperties: false
      responses:
        "200":
          description: "OK"
  /ifthen:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
              if:
                properties:
                  kind:
                    const: cat
                required: [kind]
              then:
                properties:
                  lives:
                    type: integer
              unevaluatedProperties: false
      responses:
        "200":
          description: "OK"
  /additional:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              unevaluatedProperties: false
      responses:
        "200":
          description: "OK"
components:
  schemas:
    Base:
      type: object
      properties:
        id:
          type: string
