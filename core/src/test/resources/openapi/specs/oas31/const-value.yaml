openapi: 3.1.0
info:
  title: Const Value API
  version: 1.0.0
paths:
  /const-check:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                constantValue:
                  type: string
                  const: EXPECTED_VALUE
      responses:
        '200':
          description: Ok
  /const-number:
    post:
      requestBody:
        content:
          application/json:
            schema:
              const: 5
      responses:
        '200':
          description: Ok
  /const-object:
    post:
      requestBody:
        content:
          application/json:
            schema:
              const:
                a: [1, 2.5]
      responses:
        '200':
          description: Ok
