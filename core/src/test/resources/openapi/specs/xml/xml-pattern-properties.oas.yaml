openapi: 3.1.0
info:
  title: XML Product API (patternProperties)
  version: 1.0.0

paths:
  /products:
    post:
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/Product"
  /items:
    post:
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/Item"

components:
  schemas:
    Product:
      type: object
      additionalProperties: false
      xml:
        name: product
      properties:
        sku:
          type: string
          xml:
            attribute: true
        name:
          type: string
      patternProperties:
        "^x-":
          type: integer
          maximum: 100
    Item:
      type: object
      xml:
        name: item
      properties:
        name:
          type: string
      patternProperties:
        "^x-":
          type: integer
