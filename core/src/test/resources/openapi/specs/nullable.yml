openapi: '3.0.2'
info:
  title: Nullable Test API
  version: '1.0'
servers:
  - url: https://api.server.test/
paths:
  /composition:
    post:
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  nullable: true
                telefon:
                  type: string
                  nullable: false
                contact:
                  nullable: true
                address:
                  type: object
                  nullable: true
                nullableAllOf:
                  type: object
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  nullable: true
                nonNullableAllOf:
                  type: object
                  allOf:
                    - $ref: '#/components/schemas/Address'
                nullableOneOf:
                  type: object
                  oneOf:
                    - $ref: '#/components/schemas/Address'
                  nullable: true
                nullableAnyOf:
                  type: object
                  anyOf:
                    - $ref: '#/components/schemas/Address'
                  nullable: true
components:
  schemas:
    Address:
      type: object
      required:
        - street
        - city
      properties:
        street:
          type: string
        city:
          type: string
