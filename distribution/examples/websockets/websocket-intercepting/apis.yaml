# yaml-language-server: $schema=https://www.membrane-api.io/v7.8.0.json
api:
  port: 9999
  flow:
    # WebSocket intercepting starts here
    - webSocket:
        flow:
          # logs the content of a WebSocket frame to the console
          - wsLog: {}
  target:
    host: localhost
    port: 8080
