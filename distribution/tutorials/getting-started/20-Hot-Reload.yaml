# yaml-language-server: $schema=https://www.membrane-api.io/v7.6.0.json
#
# Tutorial: Hot Reload of Configuration Changes
#
# Membrane watches YAML configuration files and reloads them automatically
# whenever they are modified and saved. No restart needed.
#
# 1.) Start Membrane:
#
#     Docker:
#       ./run-docker.sh -c 20-Hot-Reload.yaml
#     Linux/Mac:
#       ./membrane.sh -c 20-Hot-Reload.yaml
#     Windows:
#       membrane.cmd -c 20-Hot-Reload.yaml
#
# 2.) Call the API:
#     curl http://localhost:2000
#
#     You should see a list of public APIs from api.predic8.de.
#
# 3.) While Membrane is running, open this file in a text editor.
#     Change the url below from https://api.predic8.de to https://apibin.io/
#     and save the file.
#
#     The console shows "Configuration reloaded."
#
# 4.) Call the API again:
#     The response now comes from apibin.io
#
# 5.) Continue with file 30-Logging.yaml

api:
  port: 2000
  target:
    url: https://api.predic8.de
