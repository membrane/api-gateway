# yaml-language-server: $schema=https://www.membrane-api.io/v7.6.2.json
#
# Tutorial: First API
#
# Start a simple API that forwards calls to a public API.
#
# 1.) Start Membrane:
#     Open a terminal in this folder and run:
#
#     with Docker:
#       ./run-docker.sh -c 10-First-API.yaml   (Linux/Mac)
#       run-docker.cmd -c 10-First-API.yaml    (Windows)
#     or with Java:
#       ./membrane.sh -c 10-First-API.yaml     (Linux/Mac)
#       membrane.cmd -c 10-First-API.yaml      (Windows)
#
# 2.) Call the API:
#     Open http://localhost:2000 in the browser or run in a separate terminal:
#
#     curl http://localhost:2000
#     (curl is built into macOS, Linux and Windows 10+; otherwise https://curl.se/download.html)
#
#     You should see a list of public APIs.
#
# 3.) Stop Membrane:
#     Press Ctrl+C in the terminal.
#
# 4.) Continue with file 20-Hot-Reload.yaml
#
# Troubleshooting:
#     Check if your machine can reach the public API:
#
#     curl -v https://api.predic8.de

api:
  port: 2000 # Listing port
  target:
    url: https://api.predic8.de
