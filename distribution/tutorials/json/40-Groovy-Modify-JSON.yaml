# yaml-language-server: $schema=https://www.membrane-api.io/v7.8.0.json
#
# Tutorial: Modify JSON with Groovy
#
# A Groovy script can change the JSON body in place: add, change and remove
# fields. Everything the script does not touch is passed on as it is.
#
# 1.) Start Membrane:
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 40-Groovy-Modify-JSON.yaml
#       Windows:
#         run-docker.cmd -c 40-Groovy-Modify-JSON.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 40-Groovy-Modify-JSON.yaml
#       Windows:
#         membrane.cmd -c 40-Groovy-Modify-JSON.yaml
#
# 2.) Have a look at order.json, then send it to the API:
#     curl -d @order.json -H "Content-Type: application/json" localhost:2000
#
#     {"items":[{"article":"Tea","quantity":2,"price":1.87,"amount":3.74}, ...],
#      "orderId":324,"total":31.22,"currency":"EUR"}

api:
  port: 2000
  flow:
    - request:
        - groovy:
            src: |
              json.items.each { it.amount = (it.quantity * it.price).round(2) } // Add a field to every item
              json.orderId = json.remove('id')                                // Rename a field
              json.total = json.items.amount.sum().round(2)                   // Add a computed field
              json.currency = 'EUR'                                           // Add a fixed field

              // Returning json writes the changed document back as the new body.
              json
    - return:
        status: 200

# Troubleshooting:
#   Always send the header: Content-Type: application/json
#
# NOTE: JSON numbers with a decimal point are read as floating point numbers, so
#       0.99 * 12 is 11.879999999999999. Round results that represent money.
#
# See also:
#  - ../scripting folder for more Groovy and JavaScript tutorials
