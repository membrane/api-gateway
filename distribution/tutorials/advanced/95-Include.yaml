# yaml-language-server: $schema=https://www.membrane-api.io/v7.3.1.json
#
# Tutorial: Include YAML Configuration
#
# Large gateway configs become hard to maintain in a single file.
# Use include to split config across multiple files. E.g. each team can own
# and version their API definitions independently.
#
# This config mixes an inline API with a list of includes:
#   - /health                       (defined in this file)
#   - apis/shop.apis.yaml           (included)
#   - apis/fallback.apis.yaml       (included)
#   - apis/shop-orders.apis.yaml    (transitive included from shop.apis.yaml)
#
# 1.) Start Membrane:
#     ./membrane.sh -c 95-Include.yaml
#
# 2.) Health check (inline):
#     curl -i http://localhost:2000/health
#     → 200  {"status":"up"}
#
# 3.) Shop root (from apis/shop.apis.yaml):
#     curl -i http://localhost:2000/shop
#     → 200  {"status":"open"}
#
# 4.) Orders (included transitively via apis/shop.apis.yaml):
#     curl -i http://localhost:2000/shop/orders
#     → 200  [{"id":1},{"id":2}]
#
# 5.) Unknown path (from apis/fallback.apis.yaml):
#     curl -i http://localhost:2000/unknown
#     → 404

api:
  port: 2000
  path:
    uri: /health
  flow:
    - static:
        src: |
          { "status": "up" }
        contentType: application/json
    - return:
        status: 200

---
include:
  - ./apis/shop.apis.yaml
  - ./apis/fallback.apis.yaml
