# yaml-language-server: $schema=https://www.membrane-api.io/v7.8.0.json
#
# Tutorial: Path Parameters
#
# 1.) Start Membrane:
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 10-PathParameters.yaml
#       Windows:
#         run-docker.cmd -c 10-PathParameters.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 10-PathParameters.yaml
#       Windows:
#         membrane.cmd -c 10-PathParameters.yaml
#
# 2.) Call the API:
#     curl localhost:2000/customer/7/account/55
#
#     Observe the console output.

api:
  port: 2000
  path:
    uri: /customer/{id}/account/{accountNumber}
  flow:
    - template:
        src: |
          Customer: ${pathParam.id}
          Account: ${pathParam.accountNumber}
    - return:
        status: 200
