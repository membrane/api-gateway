
# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: Groovy Scripting
#
# Try:
#   curl http://localhost:2000/groovy

api:
  port: 2000
  path:
    uri: /groovy
  flow:
    - groovy:
        src: |
          println "I'm executed in the ${flow} flow"
    - return:
        status: 200

