
# yaml-language-server: $schema=https://www.membrane-api.io/v7.8.0.json
#
# Tutorial: Groovy Scripting
#
# Try:
#   curl http://localhost:2000/groovy
#   curl http://localhost:2000/random
#   curl http://localhost:2000/response
#   curl http://localhost:2000/error

api:
  port: 2000
  path:
    uri: /groovy
  flow:
    - groovy:
        src: |
          println "I'm executed in the ${flow} flow"
    - return:
        status: 200

---
api:
  port: 2000
  path:
    uri: /random
  flow:
    - groovy:
        src: |
          sites = ["https://api.predic8.de","https://httpbin.org/json","https://bored-api.appbrewery.com/random"]
          Collections.shuffle sites
          exchange.setDestinations(sites)

---
api:
  port: 2000
  path:
    uri: /response
  flow:
    - groovy:
        src: |
          Response.ok()
            .contentType("application/json")
            .header("X-Foo", "bar")
            .body("""
              {
                "success": true
              }
              """)
          .build()

---
# When a plugin fails, the flow runs back through the plugins before it.
# Plugins nested in abort only run then. If the abort was caused by an
# exception, it is available as the property abortionReason.
api:
  port: 2000
  path:
    uri: /error
  flow:
    - abort:
        - groovy:
            src: |
              println "Aborted: ${property.abortionReason?.message}"
    - groovy:
        src: |
          throw new RuntimeException("Something went wrong")

