# yaml-language-server: $schema=https://www.membrane-api.io/v7.6.2.json
#
# Tutorial: WSDL to OpenAPI — Exposing SOAP Services as REST APIs
#
# Configure each WSDL operation individually and map it to REST
# endpoints such as GET /partners/{id} and GET /partners?city=Berlin.
#
# 1.) Start Membrane
#    Linux/Mac:
#      ./membrane.sh -c 20-WSDL-to-OpenAPI-REST.yaml
#    Windows:
#      membrane.cmd -c 20-WSDL-to-OpenAPI-REST.yaml
#
# 2.) List all partners
#     curl -v http://localhost:2000/v1/partners
#
# 3.) Filter the list — input fields the path does not carry become query parameters
#     curl -v "http://localhost:2000/v1/partners?city=Berlin"
#       only Alice: the city reached the SOAP backend — see the logged message
#
# 4.) Get a single partner by id
#     curl -v http://localhost:2000/v1/partners/1
#
# 5.) Create a partner (POST, with body)
#     curl -i -d @partner.json -H "Content-Type: application/json" http://localhost:2000/v1/partners
#
# 6.) Update a partner
#     curl -X PUT -d @partner.json -H "Content-Type: application/json" http://localhost:2000/v1/partners/1
#
# 7.) Delete a partner
#     curl -X DELETE http://localhost:2000/v1/partners/1

api:
  port: 2000
  name: Partner REST API
  path:
    uri: /v1
  description: |
    # The API for Managing Partners
    This REST style API is automatically generated from a WSDL Web Service description. It transforms and routes
    JSON API to a SOAP based Web Service mock backend.
  flow:
    - wsdl2openapi:
        wsdl: mocks/partner.wsdl
        operations:
          getPartners:
            method: GET
            path: /partners
            tag: Partner
          getPartner:
            method: GET
            path: /partners/{id}
            tag: Partner
          createPartner:
            method: POST
            path: /partners
            status: 201
            tag: Partner
          updatePartner:
            method: PUT
            path: /partners/{id}
            tag: Partner
          deletePartner:
            method: DELETE
            path: /partners/{id}
            tag: Partner
  target:
    url: http://localhost:3000/partner-service

---
# Mock Web Service with static responses
include:
  - mocks/partner-service.apis.yaml
