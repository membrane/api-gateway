# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.0.json
#
# Tutorial: Access Log
#
# Do you want to know which APIs are called, by whom, and with which result?
# The access log answers that with one line per request, in the Apache
# Combined Log Format (the Common Log Format plus Referer and User-Agent), ready for
# tools like GoAccess or a log aggregator.
#
# Log vs. access log: the log is Membrane's diary (startup, warnings, errors and
# messages of the log plugin). The access log is a record of the traffic, exactly
# one line per request. Both go through Log4j2 and can be routed to different places.
# The line layout lives in log4j2-30-access.yaml.
#
# 1.) Run from this folder. Copy the logging configuration to log4j2.yaml,
#     which Membrane loads automatically, and disable terminal colors:
#       cp log4j2-30-access.yaml log4j2.yaml                                          (Linux/Mac)
#       export MEMBRANE_DISABLE_TERM_COLORS=true
#       ./membrane.sh -c 30-Access-Log.yaml
#
#       Copy-Item log4j2-30-access.yaml log4j2.yaml                                   (Windows PowerShell)
#       $env:MEMBRANE_DISABLE_TERM_COLORS="true"
#       .\membrane.cmd -c 30-Access-Log.yaml
#
#     With Docker, copy the same file first, then run:
#       export MEMBRANE_DOCKER_OPTS="-e MEMBRANE_DISABLE_TERM_COLORS=true"
#       ./run-docker.sh -c 30-Access-Log.yaml
#
#       $env:MEMBRANE_DOCKER_OPTS="-e MEMBRANE_DISABLE_TERM_COLORS=true"
#       .\run-docker.cmd -c 30-Access-Log.yaml
#
#     The environment variable disables colors. Use an image with local log4j2.yaml discovery
#     (see README.md). Clear any previous logging configuration in JAVA_OPTS,
#     since an explicit setting overrides the copied file.
#
# 2.) Call the API:
#       curl http://localhost:2000/shop/products/7 -H "Referer: https://example.com/shop"
#
# 3.) Look at the access log file. Its name contains the start time, e.g. access-2026-10-02_09-56-04.log:
#       cat access-*.log
#
#       0:0:0:0:0:0:0:1 - - [02/Oct/2026:09:56:04 +0200] "GET /shop/products/7 HTTP/1.1" 200 0 "https://example.com/shop" "curl/8.7.1"
#
# 4.) Open log4j2.yaml to see how the line is put together. The two "-" after the
#     IP address are the identity and user fields of the Common Log Format. Membrane does not
#     log them, so the pattern writes a "-" for each. A header that is not sent is logged as "-".
#
# 5.) Continue with file 31-Access-Log-Custom-Fields.yaml

# dateTimePattern gives the month as Oct instead of 10, as the Common Log Format requires.
# referer and userAgent are the two fields the Combined Log Format adds, log4j2-30-access.yaml
# writes them with %X{referer} and %X{userAgent}.
global:
  - accessLog:
      dateTimePattern: dd/MMM/yyyy:HH:mm:ss Z
      additionalPatternList:
        - name: referer
          expression: headers['Referer']
        - name: userAgent
          expression: headers['User-Agent']

---
api:
  name: Access Log
  port: 2000
  flow:
    - return:
        status: 200
