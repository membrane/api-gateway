# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.0.json
#
# Tutorial: HTTP Basic Authentication with an htpasswd File
#
# Users are read from the Apache-style htpasswd file .htpasswd in this directory.
#
# 1.) Start Membrane:
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 11-Basic-Authentication-htpasswd.yaml
#       Windows:
#         run-docker.cmd -c 11-Basic-Authentication-htpasswd.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 11-Basic-Authentication-htpasswd.yaml
#       Windows:
#         membrane.cmd -c 11-Basic-Authentication-htpasswd.yaml
#
# 2.) Without credentials:
#     curl -i localhost:2000
#
#     HTTP/1.1 401 Unauthorized
#
# 3.) Valid credentials:
#     curl -u john localhost:2000
#     enter password: smith123
#
#     You're in!
#
# 4.) Add a user with Apache's htpasswd tool (-B for bcrypt):
#     htpasswd -B .htpasswd alice
#     enter password: secret
#     Re-type new password: secret
#
#     The file now contains a line like:
#     alice:$2y$05$...
#
# 5.) Restart Membrane and call the API as alice:
#     curl -u alice localhost:2000
#     enter password: secret
#
#     You're in!

api:
  port: 2000
  flow:
    - basicAuthentication:
        htpasswdFileProvider:
          # Hashes must use crypt(3) magic strings like $5$ (SHA-256)
          location: ./.htpasswd
    - static:
        src: You're in!
    - return:
        status: 200

# NOTE: htpasswd's default $apr1$ (MD5) hashes are not supported.
# Without htpasswd, generate a SHA-256 crypt hash with:
#     openssl passwd -5 secret
# and append the line alice:<hash> to .htpasswd.
