# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.0.json
#
# Tutorial: XML Protection
#
# 1.) Start Membrane:
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 40-XML-Protection.yaml
#       Windows:
#         run-docker.cmd -c 40-XML-Protection.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 40-XML-Protection.yaml
#       Windows:
#         membrane.cmd -c 40-XML-Protection.yaml
#
# 2.) Too many attributes
#     curl -d '<foo a="1" b="2" c="3" d="4"/>' -H "Content-Type: text/xml" localhost:2000
#
# 3.) DTD Removal
#     Look at hello-dtd.xml. It contains a DTD configuration.
#
#     curl -d @hello-dtd.xml -H "Content-Type: text/xml" localhost:2000
#
#     The XML document in the response should have the DTD removed.
#
# 4.) Too deeply nested
#     curl -d '<a><b><c><d>x</d></c></b></a>' -H "Content-Type: text/xml" localhost:2000

api:
  port: 2000
  flow:
    - xmlProtection:
        maxAttributeCount: 3
        maxElementNameLength: 100
        maxDepth: 3        # Max. nesting depth of XML elements
        removeDTD: true
    - return:
        status: 200
