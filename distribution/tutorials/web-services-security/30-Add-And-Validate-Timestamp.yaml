# yaml-language-server: $schema=https://www.membrane-api.io/v7.4.0.json
#
# Tutorial: WS-Security - Add and Validate a Timestamp
#
# To show how client and server can interact we put two APIs in one gateway: the one on port 2000
# adds a wsu:Timestamp and forwards the request to the one on port 2001, which validates it
# before passing the request on to the SOAP service.
#
# 1.) Start Membrane (starts both APIs)
#    Linux/Mac:
#      ./membrane.sh -c 30-Add-And-Validate-Timestamp.yaml
#    Windows:
#      membrane.cmd -c 30-Add-And-Validate-Timestamp.yaml
#
# 2.) Send a plain SOAP request to port 2000
#    curl -d @request.xml -H "Content-Type: text/xml" http://localhost:2000
#
#    Expected: a normal SOAP response. Port 2000 added the timestamp, port 2001 validated it
#    and forwarded the request to the service. The log shows the full SOAP
#    message as it leaves port 2000 with the wsse:Security header.
#
# 3.) Send a request with an expired timestamp to port 2001
#    curl -d @request-expired-timestamp.xml -H "Content-Type: text/xml" http://localhost:2001
#
#    Expected: a soap:Fault

api:
  port: 2000
  flow:
    - request:
        - wsSecurity:
            secure:
              - timestamp: {}
        # The wsse:Security header the client never sees again once port 2001 has validated and
        # stripped it, so the full message is logged here instead.
        - log: {}
  target:
    url: http://localhost:2001

---
api:
  port: 2001
  flow:
    - request:
        - wsSecurity:
            validate:
              - timestamp: {}
    - sampleSoapService: {}

# Notice that this is a deliberately simple example.