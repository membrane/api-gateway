# yaml-language-server: $schema=https://www.membrane-api.io/v7.5.0.json
#
# Tutorial: WSDL to OpenAPI — Exposing SOAP Services as REST APIs
#
# Configure each WSDL operation individually and map it to REST
# endpoints such as GET /partners/{id} and GET /partners?city=Berlin.
#
# 1.) Start Membrane
#    Linux/Mac:
#      ./membrane.sh -c 96-WSDL-to-OpenAPI-REST.yaml
#    Windows:
#      membrane.cmd -c 96-WSDL-to-OpenAPI-REST.yaml
#
# 2.) List all partners (GET, no body)
#     curl -v http://localhost:2000/partners
#
# 3.) Filter the list — input fields the path does not carry become query parameters
#     curl -v "http://localhost:2000/partners?city=Berlin"
#       only Alice: the city reached the SOAP backend — see the logged message
#
#     GET and DELETE have no request body, so the city and kind fields of getPartners are
#     published as query parameters, keeping their XSD constraints: kind accepts only
#     PERSON, COMPANY and PUBLIC_AUTHORITY. A field holding more than a single value, such
#     as the address structure, cannot travel this way — map such an operation to POST.
#
# 4.) Get a single partner by id (GET, no body)
#     curl -v http://localhost:2000/partners/1
#
# 5.) Create a partner (POST, body required)
#     curl -d @partner.json -H "Content-Type: application/json" http://localhost:2000/partners
#
# 6.) Update a partner — ID from URL, fields in body (PUT)
#     curl -X PUT -d @partner.json -H "Content-Type: application/json" http://localhost:2000/partners/1
#
# 7.) Delete a partner — ID from URL (DELETE, no body)
#     curl -X DELETE http://localhost:2000/partners/1
#
# 8.) Continue with file 97-WSDL-XSD-Features.yaml

api:
  port: 2000
  name: Partner REST API
  description: |
    # The API for Managing Partners
    This REST style API is automatically generated from a WSDL Web Service description. It transforms and routes
    JSON API to a SOAP based Web Service mock backend.
  flow:
    - wsdl2openapi:
        wsdl: mocks/partner.wsdl
        operations:
          getPartners:
            method: GET
            path: /partners
            tag: Partner
          getPartner:
            method: GET
            path: /partners/{id}
            tag: Partner
          createPartner:
            method: POST
            path: /partners
            tag: Partner
          updatePartner:
            method: PUT
            path: /partners/{id}
            tag: Partner
          deletePartner:
            method: DELETE
            path: /partners/{id}
            tag: Partner
  target:
    url: http://localhost:3000/partner-service

---
# Mock Web Service with static responses
include:
  - mocks/partner-service.apis.yaml
