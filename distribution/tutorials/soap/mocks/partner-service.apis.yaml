# yaml-language-server: $schema=https://www.membrane-api.io/v7.5.0.json
#
# PartnerService Mock
#
# Start standalone:
#   ./membrane.sh -c mocks/partner-service.apis.yaml
#
# Routes by SOAPAction and returns a static SOAP response for each operation.

global:
  - beautifier: {}
  - log:
      label: "********* SOAP Message *********"

---
api:
  port: 3000
  name: getPartners
  test: header.SOAPAction == 'getPartners'
  flow:
    - static:
        contentType: text/xml
        src: |
          <s11:Envelope xmlns:s11="http://schemas.xmlsoap.org/soap/envelope/">
            <s11:Body>
              <p:getPartnersResponse xmlns:p="http://example.com/partner">
                <partners><id>1</id><name>Alice</name></partners>
                <partners><id>2</id><name>Bob</name></partners>
                <partners><id>3</id><name>Carol</name></partners>
              </p:getPartnersResponse>
            </s11:Body>
          </s11:Envelope>
    - return:
        status: 200

---
api:
  port: 3000
  name: getPartner
  test: header.SOAPAction == 'getPartner'
  flow:
    - request:
        - setProperty:
            name: id
            value: "${string(//*[local-name()='id'])}"
            language: xpath
    - response:
        - template:
            contentType: text/xml
            src: |
              <s11:Envelope xmlns:s11="http://schemas.xmlsoap.org/soap/envelope/">
                <s11:Body>
                  <p:getPartnerResponse xmlns:p="http://example.com/partner">
                    <partner>
                      <id>${property.id}</id>
                      <name>Alice</name>
                      <birthDate>1985-03-15</birthDate>
                      <phoneNumber>+4930123456</phoneNumber>
                      <kind>PERSON</kind>
                      <active>true</active>
                      <creditLimit>10000.00</creditLimit>
                      <address>
                        <street>Main St</street>
                        <houseNumber>1</houseNumber>
                        <postalCode>12345</postalCode>
                        <city>Springfield</city>
                        <country>US</country>
                      </address>
                    </partner>
                  </p:getPartnerResponse>
                </s11:Body>
              </s11:Envelope>
    - return:
        status: 200

---
api:
  port: 3000
  name: createPartner
  test: header.SOAPAction == 'createPartner'
  flow:
    - static:
        contentType: text/xml
        src: |
          <s11:Envelope xmlns:s11="http://schemas.xmlsoap.org/soap/envelope/">
            <s11:Body>
              <p:createPartnerResponse xmlns:p="http://example.com/partner"/>
            </s11:Body>
          </s11:Envelope>
    - return:
        status: 200

---
