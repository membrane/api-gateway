  test: header.SOAPAction == 'updatePartner'
  flow:
    - request:
        - setProperty:
            name: id
            value: "${string(//*[local-name()='id'])}"
            language: xpath
    - response:
        - template:
            contentType: text/xml
            src: |
              <s11:Envelope xmlns:s11="http://schemas.xmlsoap.org/soap/envelope/">
                <s11:Body>
                  <p:updatePartnerResponse xmlns:p="http://example.com/partner">
                    <partner>
                      <id>${property.id}</id>
                      <name>Alice Updated</name>
                      <birthDate>1985-03-15</birthDate>
                      <phoneNumber>+4930123456</phoneNumber>
                      <kind>PERSON</kind>
                      <active>true</active>
                      <creditLimit>10000.00</creditLimit>
                      <address>
                        <street>Main St</street>
                        <houseNumber>1</houseNumber>
                        <postalCode>12345</postalCode>
                        <city>Springfield</city>
                        <country>US</country>
                      </address>
                    </partner>
                  </p:updatePartnerResponse>
                </s11:Body>
              </s11:Envelope>
    - return:
        status: 200

---
api:
  port: 3000
  name: deletePartner
  test: header.SOAPAction == 'deletePartner'
  flow:
    - static:
        contentType: text/xml
        src: |
          <s11:Envelope xmlns:s11="http://schemas.xmlsoap.org/soap/envelope/">
            <s11:Body>
              <p:deletePartnerResponse xmlns:p="http://example.com/partner"/>
            </s11:Body>
          </s11:Envelope>
    - return:
        status: 200
