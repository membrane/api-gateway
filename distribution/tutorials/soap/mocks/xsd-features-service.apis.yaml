# yaml-language-server: $schema=https://www.membrane-api.io/v7.5.0.json
#
# XsdFeaturesService Mock
#
# Start standalone:
#   ./membrane.sh -c mocks/xsd-features-service.apis.yaml
#
# Routes by SOAPAction and returns a static SOAP response for each operation.

global:
  - beautifier: {}
  - log:
      label: "********* SOAP Message *********"

---
api:
  port: 2001
  name: getPrimitiveTypes
  test: header.SOAPAction == 'getPrimitiveTypes'
  flow:
    - static:
        contentType: text/xml
        src: |
          <s11:Envelope xmlns:s11="http://schemas.xmlsoap.org/soap/envelope/">
            <s11:Body>
              <f:getPrimitiveTypesResponse xmlns:f="https://example.com/xsd-features">
                <text>Widget</text>
                <count>42</count>
                <total>9007199254740991</total>
                <price>9.99</price>
                <active>true</active>
                <created>2026-08-12</created>
                <updated>2026-08-12T10:30:00Z</updated>
              </f:getPrimitiveTypesResponse>
            </s11:Body>
          </s11:Envelope>
    - return:
        status: 200

