# yaml-language-server: $schema=https://www.membrane-api.io/v7.4.0.json
#
# Tutorial: WSDL to OpenAPI
#
# A SOAP web service described by a WSDL can be automatically transformed into a
# JSON/HTTP API described by an OpenAPI document. The wsdl2openapi interceptor
# generates that OpenAPI document from the WSDL and converts incoming JSON
# requests to SOAP, and SOAP responses back to JSON.
#
# 1.) Start Membrane
#    Linux/Mac:
#      ./membrane.sh -c 95-WSDL-to-OpenAPI.yaml
#    Windows:
#      membrane.cmd -c 95-WSDL-to-OpenAPI.yaml
#
# 2.) Look at the generated OpenAPI document
#     http://localhost:2000/api-docs
#
# 3.) Invoke the JSON-fronted operation
#    curl -d '{"name":"Berlin"}' -H "Content-Type: application/json" http://localhost:2000/get-city

api:
  port: 2000
  flow:
    - wsdl2openapi:
        wsdl: cities.wsdl

---
api:
  port: 2001
  path:
    uri: /city-service
  flow:
    - sampleSoapService: {}
