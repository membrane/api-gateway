# yaml-language-server: $schema=https://www.membrane-api.io/v7.4.0.json
#
# Tutorial: WSDL to OpenAPI — Operation Settings
#
# Per-operation settings map each WSDL operation to an HTTP method and path,
# covering all four REST methods: GET, POST, PUT, DELETE.
#
# 1.) Start Membrane
#    Linux/Mac:
#      ./membrane.sh -c 96-WSDL-to-OpenAPI-Operations.yaml
#    Windows:
#      membrane.cmd -c 96-WSDL-to-OpenAPI-Operations.yaml
#
# 2.) List all partners (GET, no body)
#     curl http://localhost:2000/get-partners
#
# 3.) Get a single partner — ID comes from the URL path (GET, no body)
#     curl http://localhost:2000/partners/1
#
# 4.) Create a partner (POST, body required)
#     curl -d '{"name":"Dave","birthDate":"1990-01-01","kind":"PERSON","address":{"street":"Oak Ave","houseNumber":"5","postalCode":"54321","city":"Portland","country":"US"}}' \
#          -H "Content-Type: application/json" http://localhost:2000/create-partner
#
# 5.) Update a partner — ID from URL, fields in body (PUT)
#     curl -X PUT \
#          -d '{"name":"Alice Updated","birthDate":"1985-03-15","kind":"PERSON","address":{"street":"Main St","houseNumber":"1","postalCode":"12345","city":"Springfield","country":"US"}}' \
#          -H "Content-Type: application/json" http://localhost:2000/partners/1
#
# 6.) Delete a partner — ID from URL (DELETE, no body)
#     curl -X DELETE http://localhost:2000/partners/1

api:
  port: 2000
  flow:
    - wsdl2openapi:
        wsdl: partner-service/partner.wsdl
        operations:
          getPartners:
            method: GET
            path: partners
          getPartner:
            method: GET
            path: partners/{id}
          createPartner:
            method: POST
            path: partners
          updatePartner:
            method: PUT
            path: partners/{id}
          deletePartner:
            method: DELETE
            path: partners/{id}
  target:
    url: http://localhost:3000/partner-service

---
include:
  - partner-service/partner-service.apis.yaml
