# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: JSON to JSON Transformation with JavaScript
#
# A JavaScript script can read the JSON body, compute new values and return an
# object that becomes the new JSON body.
#
# A template is enough when the output is mostly fixed text with a few values
# filled in. Use JavaScript when the transformation needs real logic: functions,
# date conversions, calculations like an order total, or conditions. The script
# builds the result as an object, so the serialized JSON is always valid - no
# hand-written commas or quotes.
#
# 1.) Start Membrane:
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 50-JavaScript-JSON-to-JSON-Transformation.yaml
#       Windows:
#         run-docker.cmd -c 50-JavaScript-JSON-to-JSON-Transformation.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 50-JavaScript-JSON-to-JSON-Transformation.yaml
#       Windows:
#         membrane.cmd -c 50-JavaScript-JSON-to-JSON-Transformation.yaml
#
# 2.) Have a look at order.json, then send it to the API:
#     curl -d @order.json -H "Content-Type: application/json" localhost:2000
#
#     {
#       "id" : 731,
#       "date" : "2023-04-07",
#       "client" : 17,
#       "total" : 38.35,
#       "positions" : [ {
#         "pieces" : 5,
#         "price" : 5.9,
#         "article" : "Oolong"
#       }, {
#         "pieces" : 2,
#         "price" : 2.95,
#         "article" : "Assam"
#       }, {
#         "pieces" : 1,
#         "price" : 2.95,
#         "article" : "Darjeeling"
#       } ]
#     }

api:
  port: 2000
  flow:
    - request:
        - javascript:
            src: |
              function convertDate(d) {
                return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
              }

              // json holds the parsed request body. A returned object becomes the new JSON body.
              ({
                id: json.id,
                date: convertDate(new Date(json.date)),
                client: json.customer,
                total: json.items.map(i => i.quantity * i.price).reduce((a, b) => a + b),
                positions: json.items.map(i => ({
                  pieces: i.quantity,
                  price: i.price,
                  article: i.description
                }))
              })
        - beautifier: {}
    - return:
        status: 200
