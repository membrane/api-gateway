# yaml-language-server: $schema=https://www.membrane-api.io/v7.6.2.json
#
# Tutorial: CORS - Allow All
#
# Browsers block a web page from reading responses from a different origin (same-origin policy).
# CORS lets an API tell the browser which origins, methods and headers it accepts.
# The simplest setup allows everything: any origin, any method, any header.
# Use it for development only, never in production.
#
# 1.) Start Membrane:
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 10-CORS-Allow-All.yaml
#       Windows:
#         run-docker.cmd -c 10-CORS-Allow-All.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 10-CORS-Allow-All.yaml
#       Windows:
#         membrane.cmd -c 10-CORS-Allow-All.yaml
#
# 2.) Open page.html from this directory as a file in your browser (File > Open File...,
#     or Ctrl+O / Cmd+O), open the developer tools (Network tab) and click "Call API".
#     Every combination of method and headers succeeds.
#
# 3.) Send a preflight request, as a browser would before a PUT with a custom header:
#     curl -i -X OPTIONS localhost:2000 -H "Origin: https://example.com" -H "Access-Control-Request-Method: PUT" -H "Access-Control-Request-Headers: X-Foo"
#
#     HTTP/1.1 204 No Content
#     Access-Control-Allow-Origin: *
#     Access-Control-Allow-Methods: PUT
#     Access-Control-Allow-Headers: X-Foo
#     Access-Control-Max-Age: 5
#     Vary: Origin
#
# 4.) Continue with file 20-CORS-Restricted.yaml
#
# Reference: https://www.membrane-api.io/docs/current/cors.html

api:
  port: 2000
  flow:
    - cors:
        allowAll: true # For development only: skips all origin, method and header checks
    - static:
        src: Hello from the CORS API!
    - return:
        status: 200
