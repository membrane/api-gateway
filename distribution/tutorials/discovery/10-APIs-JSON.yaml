# yaml-language-server: $schema=https://www.membrane-api.io/v7.8.0.json
#
# Tutorial: APIs.json
#
# Developers, API portals and crawlers need to find out which APIs a gateway
# offers and where their documentation lives. APIs.json is a machine readable
# index for exactly that. Membrane builds it from the running configuration, so
# the index never goes stale, and tags decide which APIs it makes public.
#
# Specification: https://apisjson.org/format/apisjson_0.24.txt
#
# 1.) Start Membrane:
#     ./membrane.sh -c 10-APIs-JSON.yaml
#
# 2.) Fetch the APIs.json document:
#     curl localhost:2000/.well-known/apis.json
#
#     The Admin API is missing: only APIs tagged public are listed.

api:
  port: 2000
  path:
    uri: /.well-known/apis.json
  flow:
    - beautifier: {} # Make JSON pretty for humans
    - apisJson:
        collectionId: shop
        name: Example Shop
        description: Public APIs of the example shop
        type: collection
        tags:
          # Untagged APIs are left out as well.
          - include: public
        maintainers:
          - name: API Team
            email: api-team@example.com

---

# The following APIs are there to populate the list of APIs.

api:
  port: 2000
  openapi:
    - location: products.oas.yaml
  tags:
    - public
  info:
    contact:
      name: Shop Team
      email: shop@example.com

---

api:
  port: 2000
  name: Greeting API
  id: greeting
  path:
    uri: /greeting
  description: Says hello.
  tags:
    - public
  flow:
    - static:
        contentType: application/json
        src: '{"greeting": "Hello!"}'
    - return:
        status: 200

---

api:
  port: 2000
  name: Admin API
  path:
    uri: /admin
  tags:
    - internal
  flow:
    - return:
        status: 200
