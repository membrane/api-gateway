# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: Routing with Groovy
#
# A Groovy script chooses the backend for every request.
#
# 1.) Start Membrane:
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 60-Groovy-Routing.yaml
#       Windows:
#         run-docker.cmd -c 60-Groovy-Routing.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 60-Groovy-Routing.yaml
#       Windows:
#         membrane.cmd -c 60-Groovy-Routing.yaml
#
# 2.) Call the API several times:
#     curl localhost:2000
#
#     Backend B
#
#     The backend changes at random between Backend A, B and C.

api:
  name: Gateway
  port: 2000
  flow:
    - request:
        - groovy:
            src: |
              def backends = ['http://localhost:2010', 'http://localhost:2011', 'http://localhost:2012']
              Collections.shuffle(backends)
              exchange.setDestinations(backends)
              CONTINUE

---
api:
  name: Backend A
  port: 2010
  flow:
    - static:
        src: Backend A
    - return:
        status: 200

---
api:
  name: Backend B
  port: 2011
  flow:
    - static:
        src: Backend B
    - return:
        status: 200

---
api:
  name: Backend C
  port: 2012
  flow:
    - static:
        src: Backend C
    - return:
        status: 200

# HOW IT WORKS:
#       The destinations of an exchange are the URLs Membrane forwards the
#       request to. The script replaces them with the shuffled list of backends.
#       Membrane calls the first URL, the others are only used when the call is
#       retried.
