# yaml-language-server: $schema=https://www.membrane-api.io/v7.8.0.json
#
# Tutorial: Handle Errors with Groovy
#
# A Groovy script can abort the flow. A Groovy script in an abort block runs
# only then and can handle an error.
#
# 1.) Start Membrane:
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 90-Groovy-Abort.yaml
#       Windows:
#         run-docker.cmd -c 90-Groovy-Abort.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 90-Groovy-Abort.yaml
#       Windows:
#         membrane.cmd -c 90-Groovy-Abort.yaml
#
# 2.) Call the API without a token:
#     curl -i localhost:2000
#
#     HTTP/1.1 401 Unauthorized
#
#     {"error":"Missing X-Token header"}
#
# 3.) Call it with a token:
#     curl -i -H "X-Token: abc" localhost:2000

api:
  port: 2000
  flow:
    - request:
        - log:
            message: "Request received"
    - abort:
        - log:
            message: "Handling error"
            level: warn
        - groovy:
            src: |
              // A returned map replaces the error body
              [error: "Missing X-Token header"]
    - response:
        - log:
            message: "Response sent"
    - request:
        - groovy:
            src: |
              if (!header['X-Token']) {
                exc.response = Response.statusCode(401).build()
                return ABORT
              }
              CONTINUE
    - return:
        status: 200

# NOTE: Place abort before the interceptors whose errors it handles. Its
#       interceptors run from bottom to top, like in a response flow.
