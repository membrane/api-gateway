# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: JavaScript Built-in Variables
#
# Membrane passes the message, its parts and information about the exchange to
# every script as ready-to-use variables.
#
# 1.) Start Membrane:
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 70-JavaScript-Builtin-Variables.yaml
#       Windows:
#         run-docker.cmd -c 70-JavaScript-Builtin-Variables.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 70-JavaScript-Builtin-Variables.yaml
#       Windows:
#         membrane.cmd -c 70-JavaScript-Builtin-Variables.yaml
#
# 2.) Send a request with a header, a cookie, a query parameter and a JSON body:
#     curl -i -d "{\"name\":\"Oolong\"}" -H "Content-Type: application/json" -H "X-Customer: 42" -b "session=abc" "localhost:2000/shop/tea?limit=10"
#
#     HTTP/1.1 200 OK
#     X-Flow: RESPONSE
#     X-Status-Code: 200
#
#     {
#       "flow" : "REQUEST",
#       "method" : "POST",
#       "path" : "/shop/tea?limit=10",
#       "category" : "tea",
#       "limit" : "10",
#       "customer" : "42",
#       "session" : "abc",
#       "name" : "Oolong",
#       "tenant" : "demo"
#     }

api:
  port: 2000
  path:
    uri: /shop/{category}
  flow:
    - setProperty:
        name: tenant
        value: demo
    - request:
        - javascript:
            src: |
              // Java maps like header or property are read with get().
              // A returned object becomes the new JSON body.
              ({
                flow: flow.toString(),
                method: method,
                path: path,
                category: pathParam.get('category'),
                limit: param.get('limit').get(0),
                customer: header.get('X-Customer'),
                session: cookie.get('session'),
                name: json.name,
                tenant: property.get('tenant')
              })
        - beautifier: {}
    - response:
        - javascript:
            src: |
              header.put('X-Flow', flow.toString())
              header.put('X-Status-Code', String(statusCode))
              CONTINUE
    - return:
        status: 200

# NOTE: header, cookie, body and json refer to the message of the current flow:
#       the request in the request flow, the response in the response flow.
#       param is only available in the request flow, statusCode and response
#       only in the response flow.
#
#       All variables: https://www.membrane-api.io/scripting/builtin-variables.html
#       Built-in functions: https://www.membrane-api.io/scripting/builtin-functions.html
