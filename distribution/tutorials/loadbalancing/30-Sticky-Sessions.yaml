# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: Sticky Sessions
#
# Send all requests of a session to the same node.
#
# 1.) Start Membrane:
#       Linux/Mac:
#         ./membrane.sh -c 30-Sticky-Sessions.yaml
#       Windows:
#         membrane.cmd -c 30-Sticky-Sessions.yaml
#
# 2.) Call the balancer several times as alice:
#       curl -H "X-Session-Id: alice" localhost:2000
#
#       Node 1
#
#     Every further call with the same session id goes to the same node.
#
# 3.) Call the balancer several times as bob:
#       curl -H "X-Session-Id: bob" localhost:2000
#
#       Node 2
#
#     Each session id keeps its node.

api:
  port: 2000
  flow:
    - balancer:
        sessionIdExtractor:
          language: spel
          sessionSource: header['X-Session-Id']
        clusters:
          - nodes:
              - host: localhost
                port: 3001
              - host: localhost
                port: 3002
              - host: localhost
                port: 3003

---
api:
  port: 3001
  name: Node 1
  flow:
    - static:
        src: Node 1
    - return:
        status: 200

---
api:
  port: 3002
  name: Node 2
  flow:
    - static:
        src: Node 2
    - return:
        status: 200

---
api:
  port: 3003
  name: Node 3
  flow:
    - static:
        src: Node 3
    - return:
        status: 200

# NOTE:
#   Which node a new session lands on depends on the round robin position,
#   so you may see other node numbers. What stays the same is that one
#   session id always gets the same node.
#
#   The session id can come from any part of the message, e.g. a cookie or a
#   JSON body with language: jsonpath and sessionSource: $.id.
#   Sessions expire after sessionTimeout milliseconds (default 1 hour).
#
# Reference: https://www.membrane-api.io/docs/current/balancer.html
