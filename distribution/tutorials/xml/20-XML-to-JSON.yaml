# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: XML to JSON
#
# Convert an XML body into JSON.
#
# Try:
#
#   curl -d @animals.xml -H "Content-Type: text/xml" http://localhost:2000
#
#   With only one animal, animal is still an array:
#
#   curl -d @one-animal.xml -H "Content-Type: text/xml" http://localhost:2000
#
# Tip:
#   Make sure Content-Type is set to text/xml.

api:
  port: 2000
  flow:
    - request:
        - xml2Json:
            forceList:
              - animal # Always an array, even if there is only one
        - beautifier: {} # Format
    - return:
        status: 200

# NOTE: A repeated element becomes a JSON array, an element that occurs once
#       becomes an object. Without forceList one-animal.xml would give:
#
#         "animal": { "species": "dog", "legs": 4, "content": "Skye" }
#
#       instead of:
#
#         "animal": [ { "species": "dog", "legs": 4, "content": "Skye" } ]
#
#       The JSON type would then depend on the number of animals in the
#       message. List every element that can repeat under forceList so clients
#       always get an array.
