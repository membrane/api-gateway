# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: XML Namespaces
#
# Declare namespace prefixes for XPath once and use them everywhere.
#
# 1.) Inspect order.xml
#
# 2.) Start Membrane:
#     ./membrane.sh -c 40-XML-Namespaces.yaml
#
# 3.) Send the order:
#     curl -d @order.xml -H "Content-Type: application/xml" localhost:2000
#
#     Order: 4711
#     Customer: Alice
#     First item: Pen
#     Items: 2

components:
  ns:
    xmlConfig:
      namespaces:
          # prefixes are used to map the namespace declarations here to their usage further down
          # They need not match the document's prefixes: only the namespace URI counts.
        - prefix: o
          uri: https://example.com/orders
        - prefix: cust
          uri: https://example.com/customers

---
api:
  name: Orders
  port: 2000
  test: /o:order
  language: xpath
  flow:
    - request:
      - setHeader:
          name: X-Order-Id
          language: xpath
          value: ${/o:order/o:id}
      - setHeader:
          name: X-Customer
          language: xpath
          value: ${//cust:name}
      - setHeader:
          name: X-First-Item
          # xpath() function in SpEL
          value: ${xpath('string(//o:item[1])')}
      # xpath() function in Groovy
      - template:
          contentType: text/plain
          src: |
            Order: ${header['X-Order-Id']}
            Customer: ${header['X-Customer']}
            First item: ${header['X-First-Item']}
            Items: ${xpath('//o:item').getLength()}
    - return:
        status: 200

---
api:
  name: Fallback
  port: 2000
  flow:
    - setBody:
        contentType: text/plain
        value: No order!
    - return:
        status: 404
