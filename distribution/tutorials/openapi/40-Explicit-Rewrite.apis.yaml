# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: Explicit Server URLs Rewrite
#
# Behind a TLS-terminating reverse proxy, clients reach a public https
# address, while Membrane only sees plain http on an internal one. Automatic rewriting
# would advertise that internal address in the served OpenAPI document. A "rewrite" block
# under the openapi entry sets the public values instead. Fields you leave out keep the
# automatic behaviour.
#
# 1.) Start Membrane:
#     Linux/Mac:
#       ./membrane.sh -c 40-Explicit-Rewrite.apis.yaml
#     Windows:
#       membrane.cmd -c 40-Explicit-Rewrite.apis.yaml
#
# 2.) Fetch the OpenAPI:
#     curl localhost:2000/api-docs/minimal-shop-api-v2-0
#
#     look at:
#
#     servers:
#       - url: https://api.example.com/boutique
#
# 3.) Call the API under the new base path:
#     curl localhost:2000/boutique/products
#
#     The base path of the API is rewritten too: Membrane accepts requests under /boutique
#     instead of /store and forwards them to http://localhost:3000/boutique/products.

api:
  port: 2000
  openapi:
    - location: specs/minimal-shop-api.oas.yaml
      rewrite:
        protocol: https
        host: api.example.com
        port: 443
        basePath: /boutique

---
include:
  - mock.apis.yaml

# NOTE: basePath replaces the whole path of the server URL, it is not prepended to it.
# The original "/store" is gone.
#
# NOTE: Port 443 is the default for https, so Membrane omits it from the URL. Without
# port, Membrane would use the gateway's own port 2000.
