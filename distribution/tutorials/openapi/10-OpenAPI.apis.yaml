# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: OpenAPI
#
# All you need to deploy an API on the gateway is its OpenAPI document.
#
# 1.) Start Membrane:
#     Open a terminal in this folder and run:
#
#     with Docker:
#       Linux/Mac:
#         ./run-docker.sh -c 10-OpenAPI.apis.yaml
#       Windows:
#         run-docker.cmd -c 10-OpenAPI.apis.yaml
#
#     or with Java:
#       Linux/Mac:
#         ./membrane.sh -c 10-OpenAPI.apis.yaml
#       Windows:
#         membrane.cmd -c 10-OpenAPI.apis.yaml
#
# 2.) Open the API overview in the browser:
#     http://localhost:2000/api-docs
#
# 3.) Click on 'Fruit Shop API' to open the Swagger UI.
#
# 4.) Try out the API in the Swagger UI.
#     Membrane forwards the requests to the backend given by servers[].url in the
#     OpenAPI document (https://api.predic8.de/shop/v2).
#
# 5.) Call the API:
#     curl http://localhost:2000/shop/v2/products

api:
  port: 2000
  openapi:
    # Deploys every OpenAPI document in the folder
    - dir: specs

---
include:
  - mock.apis.yaml

# NOTE: In specs/fruitshop-v2-2-0.oas.yml the server URL points to the backend
# (https://api.predic8.de/shop/v2). When Membrane serves the document at /api-docs, it
# rewrites protocol, host and port to the address the request came in on, so that
# Swagger UI and generated clients talk to the gateway.
