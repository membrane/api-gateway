openapi: 3.1.2
info:
  # A minimal excerpt of the Fruit Shop API
  title: Minimal Shop API
  version: "2.0"
# The server URL points at the backend, here a mock started by some of the tutorials.
# When Membrane serves this document at /api-docs, it rewrites this URL so clients
# talk to the gateway instead.
servers:
  - url: http://localhost:3000/store
paths:
  /products:
    get:
      responses:
        '200':
          description: A list of products
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 10
                price:
                  type: number
                  minimum: 0
      responses:
        '201':
          description: Product created
          content:
            application/json: {}