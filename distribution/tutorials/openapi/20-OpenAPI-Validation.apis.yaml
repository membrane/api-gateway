# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: OpenAPI Validation
#
# Membrane can validate requests and responses against OpenAPI, checking paths, methods,
# parameters, headers and bodies.
#
# 1.) Start Membrane:
#     Linux/Mac:
#       ./membrane.sh -c 20-OpenAPI-Validation.apis.yaml
#     Windows:
#       membrane.cmd -c 20-OpenAPI-Validation.apis.yaml
#
# 2.) Try creating a new product with a negative price:
#     curl "http://localhost:2000/store/products" -H "Content-Type: application/json" -d "{ \"name\": \"Figs\", \"price\": -2.7}"
#
#     Check the validation error in the response.
#
# 3.) Send a property the schema does not define:
#     curl "http://localhost:2000/store/products" -H "Content-Type: application/json" -d "{ \"name\": \"Figs\", \"price\": 2.7, \"color\": \"purple\"}"
#
#     "REQUEST/BODY#/color" : [ {
#       "message" : "The schema is false and does not allow any value.",
#
# 4.) Continue with file 40-Explicit-Rewrite.apis.yaml

api:
  port: 2000
  openapi:
    - location: specs/minimal-shop-api.oas.yaml
      validateRequests: true
      validateResponses: true
      # Include the detailed list of validation errors in the error response.
      # Consider turning it off in production to avoid exposing API internals.
      validationDetails: true
