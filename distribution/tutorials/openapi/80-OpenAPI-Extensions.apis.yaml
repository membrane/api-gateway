# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: Membrane Extensions in the OpenAPI Document
#
# Settings for Membrane can live in the OpenAPI document itself, so they travel with it.
# See specs/shop-api-extensions.oas.yaml.
#
# 1.) Start Membrane:
#     Linux/Mac:
#       ./membrane.sh -c 80-OpenAPI-Extensions.apis.yaml
#     Windows:
#       membrane.cmd -c 80-OpenAPI-Extensions.apis.yaml
#
# 2.) List the deployed APIs:
#     curl localhost:2000/api-docs
#
#     {
#       "shop-v2-0" : {
#         "openapi" : "3.1.2",
#         "title" : "Minimal Shop API",
#         "version" : "2.0",
#         "openapi_link" : "/api-docs/shop-v2-0",
#         "ui_link" : "/api-docs/ui/shop-v2-0"
#       }
#     }
#
# 3.) Fetch the document by its ID:
#     curl localhost:2000/api-docs/shop-v2-0
#
# 4.) Create a product with a negative price:
#     curl "http://localhost:2000/ext-shop/products" -H "Content-Type: application/json" -d "{ \"name\": \"Figs\", \"price\": -2.7}"
#
#     400 with the validation errors, although the configuration below does not turn on validation.

api:
  port: 2000
  openapi:
    - location: specs/shop-api-extensions.oas.yaml

# NOTE: Without x-membrane-id, the ID is built from info.title and info.version: every run
# of non-word characters becomes "-" and the result is lowercased.
# "Fruit Shop API" 2.2.0 becomes fruit-shop-api-v2-2-0 (see 10-OpenAPI.apis.yaml).
# With x-membrane-id, the version is still appended: shop + 2.0 becomes shop-v2-0.
#
# NOTE: Settings in the configuration override x-membrane-validation, e.g.
# validateRequests: false on the openapi entry turns request validation off again.
