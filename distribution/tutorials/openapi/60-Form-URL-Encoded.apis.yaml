# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: Validating application/x-www-form-urlencoded messages
#
# HTML forms post their fields as application/x-www-form-urlencoded.
# When the OpenAPI description declares that media type, Membrane can validate the form fields
# against its schema.
#
# 1.) Start Membrane:
#     Linux/Mac:
#       ./membrane.sh -c 60-Form-URL-Encoded.apis.yaml
#     Windows:
#       membrane.cmd -c 60-Form-URL-Encoded.apis.yaml
#
# 2.) Send a valid form post (curl uses application/x-www-form-urlencoded by default for -d):
#     curl localhost:2000/forms/orders -v -d "product=Shoes&quantity=5"
#
#     The request passes to the backend:
#
#     {
#       "status": "accepted"
#     }
#
# 3.) Order a negative quantity:
#     curl localhost:2000/forms/orders -v -d "product=Shoes&quantity=-5"
#
#     Rejected with status 400: "quantity" is below the minimum of 1.

api:
  port: 2000
  openapi:
    - location: specs/form-validation.oas.yaml
      validateRequests: true

---
include:
  - mock.apis.yaml
