# yaml-language-server: $schema=https://www.membrane-api.io/v7.8.0.json
#
# Tutorial: Position of the OpenAPI Validation in the Flow
#
# By default, Membrane validates against the OpenAPI document before the flow runs.
# Placing openapiValidator in the flow moves the validation to that position.
#
# Run jsonProtection before the validation: it rejects oversized or deeply nested JSON
# cheaply, before the validator checks the values against regex patterns, which attackers
# can target with ReDoS. See:
# http://localhost:8080/security/membrane-redos-protection.html
#
# 1.) Start Membrane:
#     Linux/Mac:
#       ./membrane.sh -c 21-Validation-Advanced.apis.yaml
#     Windows:
#       membrane.cmd -c 21-Validation-Advanced.apis.yaml
#
# 2.) Send a product with a key longer than jsonProtection allows:
#     curl "http://localhost:2000/store/products" -H "Content-Type: application/json" -d "{\"weight\":1}"
#
#     Response: 400 "OpenAPI message validation failed"
#
#     The OpenAPI validation ran first and processed the request before jsonProtection.
#
# 3.) Remove the # in front of "- openapiValidator: {}" below and save the file.
#     Membrane reloads the configuration.
#
# 4.) Repeat the curl from step 2.
#
#     Response: 400 "JSON Protection Violation" ... "Exceeded maxKeyLength."
#
#     Now jsonProtection rejects the request before it reaches the validation.

api:
  port: 2000
  openapi:
    - location: specs/minimal-shop-api.oas.yaml
      validateRequests: true
  flow:
    - jsonProtection:
        maxKeyLength: 5
    - log: {}
#    - openapiValidator: {}

---
include:
  - mock.apis.yaml
