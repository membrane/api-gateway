# yaml-language-server: $schema=https://www.membrane-api.io/v7.7.1.json
#
# Tutorial: OpenAPI with a Target
#
# A target sends the requests to a backend of your choice instead of servers[].url from
# the OpenAPI document, e.g. to a mock, a test system or an internal address.
#
# 1.) Start Membrane:
#     Linux/Mac:
#       ./membrane.sh -c 11-OpenAPI-Target.apis.yaml
#     Windows:
#       membrane.cmd -c 11-OpenAPI-Target.apis.yaml
#
# 2.) Call the API:
#     curl http://localhost:2000/store/products

api:
  port: 2000
  name: Shop API
  openapi:
    - location: specs/minimal-shop-api.oas.yaml
  # Use the target for routing instead of servers[].url in the OpenAPI
  target:
    url: http://localhost:3001

---
include:
  - mock.apis.yaml
